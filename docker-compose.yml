services:
  userbot-drive:
    build: .
    container_name: userbot-drive
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      HOME: /home/appuser
      RCLONE_DEST: ${RCLONE_DEST:-gdrive:media}
      QUEUE_FILE: /app/downloads/queue.json
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import queue_store; queue_store.load_queue()\""]
      interval: 30s
      timeout: 5s
      retries: 3
    command: python userbot_drive.py
    volumes:
      - ./downloads:/app/downloads
      - ./my_account.session:/app/my_account.session
      - ./my_account.session-journal:/app/my_account.session-journal
      - ./rclone.conf:/home/appuser/.config/rclone/rclone.conf:ro
